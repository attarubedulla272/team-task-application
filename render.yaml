services:
  - type: web
    name: team-task-application
    runtime: node
    plan: free
    buildCommand: npm ci && npm --prefix backend ci && npm run build
    startCommand: npm --prefix backend start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: MONGODB_URI
        sync: false
